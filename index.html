<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Green Star Eniyadi | Arts & Sports Club</title>
<style>
/* Your existing website styles remain unchanged. */
</style>
</head>
<body>
<!-- Your existing website HTML remains unchanged. -->

<script>
const PREVIOUS_SUBSCRIPTION_REASON = 'Previous monthly subscription';

function renderPublic() {
  const paidIds = new Set(publicData.payments.map(x => x.member_id));

  // Keep your existing hero, achievement and memory rendering here.

  const q = (document.getElementById('search').value || '').toLowerCase();
  const members = publicData.members.filter(m =>
    (m.name + ' ' + m.role).toLowerCase().includes(q)
  );

  document.getElementById('memberGrid').innerHTML = members.length
    ? members.map(m => {
        const paid = paidIds.has(m.id);
        const currentMonthPending = paid
          ? 0
          : Number(publicData.monthlyFee || 100);

        const dues = (Array.isArray(publicData.extraDues)
          ? publicData.extraDues
          : []
        ).filter(d => String(d.member_id) === String(m.id));

        const previousSubscriptionPending = dues
          .filter(d => d.reason === PREVIOUS_SUBSCRIPTION_REASON)
          .reduce((sum, d) => sum + Math.max(
            0,
            Number(d.total_amount || 0) - Number(d.paid_amount || 0)
          ), 0);

        const monthlyPending =
          currentMonthPending + previousSubscriptionPending;

        const extraPending = dues
          .filter(d => d.reason !== PREVIOUS_SUBSCRIPTION_REASON)
          .reduce((sum, d) => sum + Math.max(
            0,
            Number(d.total_amount || 0) - Number(d.paid_amount || 0)
          ), 0);

        const totalPending = monthlyPending + extraPending;

        return `<article class="member">
          <div class="avatar">${initials(m.name)}</div>
          <div>
            <h3>${esc(m.name)}</h3>
            <p>${esc(m.role)}</p>
            <div class="memberDues">
              <p>Monthly subscription: <strong>${money(monthlyPending)}</strong></p>
              <p>Extra due: <strong>${money(extraPending)}</strong></p>
              <p>Total: <strong>${money(totalPending)}</strong></p>
            </div>
          </div>
          <span class="status ${paid ? 'paid' : 'pending'}">
            ${paid ? 'MONTHLY PAID' : 'MONTHLY PENDING'}
          </span>
        </article>`;
      }).join('')
    : '<div class="empty">No members found.</div>';
}

function renderExtraDueMembers() {
  const members = adminData.members?.length
    ? adminData.members
    : publicData.members || [];

  ['extraDueMember', 'genuineExtraDueMember'].forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;

    const current = el.value;
    el.innerHTML = members.length
      ? members.map(m =>
          `<option value="${esc(m.id)}">${esc(m.name)}</option>`
        ).join('')
      : '<option value="">No members available</option>';

    if (current && members.some(m => String(m.id) === String(current))) {
      el.value = current;
    }
  });
}

function renderExtraDues() {
  const el = document.getElementById('extraDueTable');
  if (!el) return;

  renderExtraDueMembers();

  const visibleDues = adminData.extraDues.filter(
    d => d.reason !== PREVIOUS_SUBSCRIPTION_REASON
  );

  el.innerHTML = visibleDues.length
    ? visibleDues.map(d => {
        const member = adminData.members.find(
          m => String(m.id) === String(d.member_id)
        );
        const total = Number(d.total_amount || 0);
        const paid = Number(d.paid_amount || 0);
        const remaining = Math.max(0, total - paid);

        return `<tr>
          <td><b>${esc(member ? member.name : 'Member removed')}</b></td>
          <td>${esc(d.reason)}</td>
          <td>${money(total)}</td>
          <td>${money(paid)}</td>
          <td><b>${money(remaining)}</b></td>
          <td>
            <button class="action" onclick="addExtraPayment('${d.id}')">Add payment</button>
            <button class="action" onclick="editExtraDue('${d.id}')">Edit</button>
            <button class="action delete" onclick="removeExtraDue('${d.id}')">Delete</button>
          </td>
        </tr>`;
      }).join('')
    : '<tr><td colspan="6">No extra member dues yet.</td></tr>';
}

// This form adds previous subscription arrears ONLY.
async function addExtraDue(e) {
  e.preventDefault();

  try {
    const memberId = document.getElementById('extraDueMember').value;
    const total = Number(document.getElementById('extraDueTotal').value);
    const paid = Number(document.getElementById('extraDuePaid').value);

    if (!memberId) return toast('Please select a member');

    if (!Number.isFinite(total) || !Number.isFinite(paid) ||
        total < 0 || paid < 0 || paid > total) {
      return toast('Invalid paid or total amount');
    }

    const existing = adminData.extraDues.find(d =>
      String(d.member_id) === String(memberId) &&
      d.reason === PREVIOUS_SUBSCRIPTION_REASON
    );

    if (existing) {
      await api('/api/member-budgets', {
        method: 'PUT',
        body: JSON.stringify({
          id: existing.id,
          totalAmount: total,
          paidAmount: paid
        })
      });
    } else {
      await api('/api/member-budgets', {
        method: 'POST',
        body: JSON.stringify({
          memberId,
          reason: PREVIOUS_SUBSCRIPTION_REASON,
          totalAmount: total,
          paidAmount: paid
        })
      });
    }

    e.target.reset();
    document.getElementById('extraDuePaid').value = '0';
    toast('Monthly subscription amount saved');
    await loadAdminData();
    await loadPublic();
  } catch (err) {
    toast(err.message);
  }
}

// This separate form adds genuine extra dues.
async function addGenuineExtraDue(e) {
  e.preventDefault();

  try {
    const memberId = document.getElementById('genuineExtraDueMember').value;
    const reason = document.getElementById('genuineExtraDueReason').value.trim();
    const total = Number(document.getElementById('genuineExtraDueTotal').value);
    const paid = Number(document.getElementById('genuineExtraDuePaid').value);

    if (!memberId || !reason) {
      return toast('Select a member and enter a reason');
    }

    if (!Number.isFinite(total) || !Number.isFinite(paid) ||
        total < 0 || paid < 0 || paid > total) {
      return toast('Invalid paid or total amount');
    }

    await api('/api/member-budgets', {
      method: 'POST',
      body: JSON.stringify({
        memberId,
        reason,
        totalAmount: total,
        paidAmount: paid
      })
    });

    e.target.reset();
    document.getElementById('genuineExtraDuePaid').value = '0';
    toast('Extra due added');
    await loadAdminData();
    await loadPublic();
  } catch (err) {
    toast(err.message);
  }
}
</script>
</body>
</html>
